# Alembic configuration. The database URL is not set here: migrations/env.py
# reads it from the app settings (DATABASE_URL / backend/.env).
#
# New schema change (run from backend/):
#   .venv\Scripts\alembic.exe revision --autogenerate -m "short description"
# then review the generated file in migrations/versions/ and commit it.
# Migrations are applied automatically at server start (app/core/migrations.py);
# to apply them by hand:  .venv\Scripts\alembic.exe upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
