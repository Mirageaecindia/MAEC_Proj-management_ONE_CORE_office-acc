# MAEC ProManage: the whole app in three containers. Needs only Docker on the host.
#   cp .env.example .env   (then fill it in)
#   docker compose up -d --build
# Deployment guide: docs/DEPLOYMENT.md

name: maec

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: promanage
      POSTGRES_USER: promanage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promanage -d promanage"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://promanage:${POSTGRES_PASSWORD}@db:5432/promanage
    volumes:
      # Optional HR seed (employee_leads.csv): copied to the server by hand, never baked into the image.
      - ./backend/data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

# The database and the HTTPS certificates survive rebuilds and restarts.
volumes:
  db-data:
  caddy-data:
  caddy-config:
